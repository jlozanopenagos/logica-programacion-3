<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de factorial</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container">
        <h1>Calculadora de factorial</h1>

        <form id="factorialForm">
            <label for="numberInput">Ingresa un número entero NO negativo:</label>
            <input type="number" id="numberInput" min="0" placeholder="Ej: 5" required>
            <button type="submit" id="calculateBtn">Calcular factorial</button>
        </form>

        <section id="resultContainer" class="result-container">
            <p id="resultText"></p>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
